# M0 baseline: the agent's SA as commonly configured (admin in team-a, view cluster-wide).
apiVersion: v1
kind: List
items:
- apiVersion: rbac.authorization.k8s.io/v1
  kind: RoleBinding
  metadata: {name: s1-agent-admin, namespace: team-a, labels: {s1/placement: m0}}
  roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: admin}
  subjects: [{kind: ServiceAccount, name: coding-agent, namespace: agents}]
- apiVersion: rbac.authorization.k8s.io/v1
  kind: ClusterRoleBinding
  metadata: {name: s1-agent-view, labels: {s1/placement: m0}}
  roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
  subjects: [{kind: ServiceAccount, name: coding-agent, namespace: agents}]
