# M1-L: M1 plus a leftover legacy impersonator role (the docs' "impersonator" example). Applied together with 31.
apiVersion: v1
kind: List
items:
- apiVersion: rbac.authorization.k8s.io/v1
  kind: ClusterRole
  metadata: {name: s1-agent-legacy-impersonator, labels: {s1/placement: m1l}}
  rules: [{apiGroups: [""], resources: [users, groups, serviceaccounts], verbs: [impersonate]}]
- apiVersion: rbac.authorization.k8s.io/v1
  kind: ClusterRoleBinding
  metadata: {name: s1-agent-legacy-impersonator, labels: {s1/placement: m1l}}
  roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: s1-agent-legacy-impersonator}
  subjects: [{kind: ServiceAccount, name: coding-agent, namespace: agents}]
