# Rights that do not change between placements. alice is bound BY USER NAME (preflight P-7).
apiVersion: v1
kind: List
items:
- apiVersion: rbac.authorization.k8s.io/v1
  kind: RoleBinding
  metadata: {name: alice-admin, namespace: team-a}
  roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: admin}
  subjects: [{apiGroup: rbac.authorization.k8s.io, kind: User, name: "oidc:alice"}]
- apiVersion: rbac.authorization.k8s.io/v1
  kind: RoleBinding
  metadata: {name: alice-admin, namespace: team-b}
  roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: admin}
  subjects: [{apiGroup: rbac.authorization.k8s.io, kind: User, name: "oidc:alice"}]
- apiVersion: rbac.authorization.k8s.io/v1
  kind: ClusterRoleBinding
  metadata: {name: s1-alice-view}
  roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
  subjects: [{apiGroup: rbac.authorization.k8s.io, kind: User, name: "oidc:alice"}]
- apiVersion: rbac.authorization.k8s.io/v1
  kind: ClusterRoleBinding
  metadata: {name: s1-deployer-edit}
  roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: edit}
  subjects: [{kind: ServiceAccount, name: deployer, namespace: team-a}]
- apiVersion: rbac.authorization.k8s.io/v1
  kind: Role
  metadata: {name: own-cm, namespace: thief}
  rules: [{apiGroups: [""], resources: [configmaps], resourceNames: [own], verbs: [get]}]
- apiVersion: rbac.authorization.k8s.io/v1
  kind: RoleBinding
  metadata: {name: own-cm, namespace: thief}
  roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: own-cm}
  subjects: [{kind: ServiceAccount, name: thief, namespace: thief}]
